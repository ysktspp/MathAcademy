<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Космічна місія Тимка – математика 4 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1033;--pn:#1a1f5c;--pn2:#262c7a;--ed:#3a42a8;
  --tx:#f1f4ff;--mu:#a9b2ee;--cy:#4de1ff;--gr:#5df2a0;
  --ye:#ffd84d;--pk:#ff7ad9;--rd:#ff6b7a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Nunito,system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.4;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#cfe,transparent),radial-gradient(2px 2px at 160px 60px,#ffd84d,transparent),radial-gradient(circle at 80% 0,#3b2a8f55,transparent 50%);
  background-size:200px 160px,200px 160px,240px 200px,100% 100%;
  background-attachment:fixed;
}
button{cursor:pointer;font:inherit;font-weight:800;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
h1,h2,.big,.rk{font-family:Rubik,sans-serif}

.top{display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:1000px;margin:auto;padding:.8rem 1rem}
.brand{display:flex;gap:.7rem;align-items:center}
.brand i{font-style:normal;font-size:2.2rem}
.brand h1{font-size:1.25rem;font-weight:900;line-height:1.2}
.brand p{color:var(--mu);font-size:.8rem}

.pl{background:var(--pn);border:2px solid var(--ed);border-radius:16px;padding:.5rem .9rem;flex:1 1 260px}
.rk{font-weight:700;font-size:.95rem}
.bar{height:12px;background:#0d1033;border-radius:8px;overflow:hidden;margin:.3rem 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr));width:0;transition:width .4s}
.sm{font-size:.78rem;color:var(--mu)}

main{max-width:1000px;margin:auto;padding:0 .8rem 2.5rem}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.8rem}
.tab{background:var(--pn);border:2px solid var(--ed);border-radius:14px;padding:.5rem .2rem;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:.1rem}
.tab span{font-size:1.35rem}
.tab small{color:var(--mu);font-weight:600;font-size:.75rem}
.tab.on{background:var(--cy);color:#06113a;border-color:var(--cy)}
.tab.on small{color:#06113a}

.pills,.lvs{
  display:flex;gap:.5rem;overflow-x:auto;padding:.2rem .2rem .6rem;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.pills::-webkit-scrollbar,.lvs::-webkit-scrollbar{display:none}

.pill{white-space:nowrap;background:var(--pn);border:2px solid var(--ed);border-radius:30px;padding:.45rem .85rem;min-height:42px;display:inline-flex;align-items:center;font-size:.9rem}
.pill.on{background:var(--pk);border-color:var(--pk);color:#2a0a25}
.pill em{font-style:normal;font-size:.75rem;opacity:.85;margin-left:.35rem}

.lv{flex:0 0 135px;background:var(--pn2);border:2px solid var(--ed);border-radius:14px;padding:.5rem .4rem;text-align:center;min-height:52px;font-size:.85rem}
.lv.on{border-color:var(--ye);background:#3a3590}
.lv.ok{border-color:var(--gr)}
.lv small{display:block;color:var(--mu);font-weight:600;font-size:.72rem}

.stage{background:var(--pn);border:2px solid var(--ed);border-radius:20px;padding:1rem;display:grid;grid-template-columns:130px 1fr;gap:1rem;align-items:start}
.ty{text-align:center}
.ty b{display:block;font-size:4.5rem;line-height:1;animation:fl 3s ease-in-out infinite}
.ty span{font-family:Rubik;font-weight:700;color:var(--gr);font-size:.95rem}
@keyframes fl{50%{transform:translateY(-8px) rotate(3deg)}}

.say{background:#fff;color:#1b1f4d;border-radius:14px;padding:.65rem .9rem;font-weight:800;position:relative;margin-bottom:.8rem;font-size:.95rem}
.say::before{content:"";position:absolute;left:-9px;top:18px;border:9px solid transparent;border-right-color:#fff;border-left:0}

.board{background:#0a0d2b;border:2px dashed var(--ed);border-radius:14px;padding:.9rem;margin-bottom:.8rem;overflow-x:auto;text-align:center}
pre{font-family:"Courier New",monospace;font-size:clamp(1.4rem, 6vw, 2rem);font-weight:700;line-height:1.2;display:inline-block;color:var(--ye);text-align:right}
.dv{display:inline-flex;font-family:"Courier New",monospace;font-size:clamp(1.4rem, 6vw, 2rem);font-weight:700;color:var(--ye);align-items:flex-start}
.dv span{padding:0 .5rem}
.dv .d{border-left:3px solid var(--ye);border-bottom:3px solid var(--ye);margin-left:.3rem;margin-top:0}
.ex{font-family:Rubik;font-size:clamp(1.2rem, 5vw, 1.7rem);font-weight:700;color:var(--ye);overflow-wrap:anywhere}
.tx{font-size:1.1rem;font-weight:700;line-height:1.45;text-align:left}

.row{display:flex;gap:.5rem;flex-wrap:wrap}
input{
  flex:1;min-width:140px;font-size:1.5rem;font-family:Rubik;font-weight:700;
  padding:.55rem .8rem;border-radius:12px;border:2.5px solid var(--ed);
  background:#0a0d2b;color:var(--tx);min-height:50px;text-align:center;
}
.b{border:0;border-radius:12px;padding:.65rem 1rem;min-height:50px;background:var(--gr);color:#04301a;box-shadow:0 4px 0 #229a5c;font-size:1rem}
.b.g{background:var(--pn2);color:var(--tx);box-shadow:0 4px 0 #14185a;font-size:.9rem}
.b:active{transform:translateY(3px);box-shadow:none}

.msg{margin-top:.6rem;font-weight:800;min-height:1.4rem;font-size:.95rem}
.msg.ok{color:var(--gr)}.msg.no{color:var(--rd)}
.sol{display:none;margin-top:.7rem;background:#2b2a70;border-radius:12px;padding:.75rem;font-size:.9rem;line-height:1.4}
.sol.open{display:block}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,200%);background:var(--ye);color:#2a2000;font-weight:900;padding:.75rem 1.2rem;border-radius:14px;transition:transform .25s;z-index:99;text-align:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.toast.show{transform:translate(-50%,0)}

footer{text-align:center;padding:1rem;margin-top:auto}
footer button{background:none;border:0;color:var(--mu);text-decoration:underline;font-weight:600;font-size:.85rem;padding:.5rem}
.warn{display:none;background:#5a1d2a;border-radius:10px;padding:.5rem .8rem;margin-bottom:.8rem;font-size:.85rem}

@media (max-width:640px){
  .top{padding:.6rem .8rem}
  .stage{grid-template-columns:1fr;gap:.7rem;padding:.9rem}
  .ty{display:flex;align-items:center;gap:.7rem;text-align:left}
  .ty b{font-size:3rem}
  .say::before{left:20px;top:-8px;border:8px solid transparent;border-bottom-color:#fff;border-top:0;border-right-color:transparent}
  .row{flex-direction:column}
  .row input{width:100%;min-height:52px}
  .row .b{width:100%;min-height:50px}
  .row.sub-actions{flex-direction:row}
  .row.sub-actions .b{flex:1}
  .lv{flex:0 0 115px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 <div class="brand"><i>🚀</i><div><h1>Космічна місія Тимка</h1><p>Математика · 4 клас</p></div></div>

     <button class="b" id="chk">Перевірити 🚀</button>
   </div>
   <div class="row sub-actions" style="margin-top:.6rem">
     <button class="b g" id="hint">💡 Підказка</button>
     <button class="b g" id="skip">⏭ Інше</button>
   </div>
   <div class="msg" id="msg" role="status"></div>
   <div class="sol" id="sol"></div>
  </div>
 </section>
</main>
<footer><button id="reset">Почати місію спочатку (скинути прогрес)</button></footer>
<div class="toast" id="toast" role="status"></div>

 return `<pre>${f(a).padStart(w)}\n${op+f(b).padStart(w-1)}\n${"─".repeat(w)}</pre>`}

 add(l){const d=[4,5,6][l-1],a=R(10**(d-1),10**d-1),b=R(10**(d-1),10**d-1);return{h:col(a,"+",b),a:a+b}},

 eq(l){const x=R(20,900)*(l==1?10:5),a=R(2,9)*(l==1?100:10),c=R(2,9);let t;

 u(l){const[B,S,f]=P([["км","м",1000],["м","см",100],["кг","г",1000],["ц","кг",100],["год","хв",60],["грн","коп.",100],["хв","с",60],["т","кг",1000]]);

["id","Першого дня музей відвідало 230 школярів, другого – на 40 більше, а третього – на 70 менше, ніж другого. Скільки школярів було за три дні?",700,"1) 230 + 40 = 270. 2) 270 − 70 = 200. 3) 230 + 270 + 200 = 700."],

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){$("warn").style.display="block"}};
let tab="expr",cat="add",lvl=1,cur,tries=0,rev=false,tt;
const NEED=5,ck=(t,c,l)=>t+"|"+c+"|"+l,cn=(t,c,l)=>st.c[ck(t,c,l)]||0;
const pool=()=>tab=="tasks"?TASKS.filter(t=>t[0]==cat):LOGIC.map(t=>["l",...t]);
const dkey=()=>tab=="tasks"?cat:"l",dn=c=>(st.d[c]||[]).length;
const poolOf=(t,c)=>t=="tasks"?TASKS.filter(x=>x[0]==c).length:LOGIC.length;
function secDone(t){const cs=SECT[t][2];return cs.reduce((s,[c])=>s+(t=="expr"||t=="units"?[1,2,3].reduce((q,l)=>q+Math.min(cn(t,c,l),NEED),0):dn(t=="tasks"?c:"l")),0)}
function secAll(t){const cs=SECT[t][2];return cs.reduce((s,[c])=>s+(t=="expr"||t=="units"?3*NEED:poolOf(t,c)),0)}
const hasLv=()=>tab=="expr"||tab=="units";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}

function renderTop(){
  const lv=Math.floor(st.xp/100)+1;
  $("rk").textContent="⭐ Рівень "+lv+" · "+RANKS[Math.min(lv-1,RANKS.length-1)];
  $("xb").style.width=(st.xp%100)+"%";
  $("xt").textContent=(st.xp%100)+" / 100 очок до рівня · разом "+st.xp;
  $("tabs").innerHTML=Object.entries(SECT).map(([k,[i,n]])=>`<button class="tab ${k==tab?"on":""}" data-t="${k}"><span>${i}</span>${n}<small>${secDone(k)}/${secAll(k)}</small></button>`).join("");
}

function renderNav(){
  const cs=SECT[tab][2];
  $("pills").style.display=cs.length>1?"flex":"none";
  $("pills").innerHTML=cs.map(([c,i,n])=>{
    const d=tab=="expr"?[1,2,3].reduce((q,l)=>q+Math.min(cn(tab,c,l),NEED),0):tab=="tasks"?dn(c):0;
    const a=tab=="expr"?3*NEED:poolOf(tab,c);
    return`<button class="pill ${c==cat?"on":""}" data-c="${c}">${i} ${n}<em>${d}/${a}</em></button>`;
  }).join("");

  $("lvs").style.display=hasLv()?"flex":"none";
  $("lvs").innerHTML=hasLv()?[1,2,3].map(l=>{
    const n=cn(tab,cat,l);
    return`<button class="lv ${l==lvl?"on":""} ${n>=NEED?"ok":""}" data-l="${l}">${n>=NEED?"✅":"⭐"} ${tab=="units"?ULV[l-1]:LVN[l-1]}<small>${Math.min(n,NEED)}/${NEED} · +${10*l}</small></button>`;
  }).join(""):""
}

function next(){
  rev=false;tries=0;$("inp").value="";$("msg").textContent="";$("msg").className="msg";$("sol").classList.remove("open");
  $("hint").style.display=hasLv()?"none":"";
  if(hasLv()){
    cur=G[tab=="units"?"u":cat](lvl);cur.pts=10*lvl;
    $("say").textContent=tab=="units"?"Тимко: перепиши в зошит, обчисли і запиши число.":cat=="eq"?"Тимко: знайди x. Розв’яжи в зошиті, запиши сюди.":cat=="combo"?"Тимко: спочатку порядок дій! Рахуй уважно.":"Тимко: перепиши приклад у зошит у стовпчик і порахуй!";
    $("board").innerHTML=cur.h;
  } else {
    const p=pool(),dn_=st.d[dkey()]||[],free=p.map((_,i)=>i).filter(i=>!dn_.includes(i));
    const i=free.length?free[0]:R(0,p.length-1);cur={a:p[i][2],sol:p[i][3],i,pts:free.length?(tab=="tasks"?30:20):0};
    $("say").textContent=tab=="tasks"?"Тимко: запиши умову й розв’язок у зошит, а тут напиши відповідь.":"Тимко: подумай добре! Це завдання з секретом.";
    $("board").innerHTML=`<div class="tx">${p[i][1]}</div>`;
    if(!free.length)toast("🏆 Усе в цій темі пройдено! Тренуйся ще без очок.");
  }
  $("sol").innerHTML="<b>Розв’язок:</b> "+(cur.sol||"");
}

function show(){renderTop();renderNav();next()}

function check(){
  const v=Number($("inp").value.replace(/[\s\u00a0]/g,"").replace(",","."));
  if($("inp").value.trim()===""||isNaN(v)){
    $("msg").textContent="Введи число 🙂";$("msg").className="msg no";return;
  }
  const m=$("msg");
  if(v===cur.a){
    const pts=rev?0:cur.pts;let extra="";
    if(hasLv()){
      const k=ck(tab,cat,lvl),b=cn(tab,cat,lvl);
      if(b<NEED&&!rev)st.c[k]=b+1;
      if(b<NEED&&b+1==NEED)extra=" 🏅 Орбіту пройдено!";
    } else if(!rev){
      const k=dkey();st.d[k]=st.d[k]||[];
      if(!st.d[k].includes(cur.i)){st.d[k].push(cur.i)}
    }
    const before=Math.floor(st.xp/100);
    st.xp+=hasLv()?(cn(tab,cat,lvl)<=NEED?pts:0):pts;
    save();
    m.className="msg ok";m.textContent=P(OK)+(pts?" +"+pts+" очок":"")+extra;
    if(Math.floor(st.xp/100)>before)toast("🚀 Новий рівень! "+RANKS[Math.min(Math.floor(st.xp/100),RANKS.length-1)]);
    renderTop();renderNav();setTimeout(next,1500);
  } else {
    tries++;m.className="msg no";
    m.textContent=P(NO)+(tries>=3&&hasLv()?" (Підказка: порахуй у стовпчику ще раз, уважно до розрядів)":"");
    $("board").classList.remove("shake");void $("board").offsetWidth;$("board").classList.add("shake");
  }
}

$("chk").onclick=check;
$("inp").onkeydown=e=>{if(e.key==="Enter")check()};
$("skip").onclick=next;
$("hint").onclick=()=>{
  rev=true;$("sol").classList.add("open");
  $("msg").textContent="З підказкою очки не нараховуються, але потренуватись можна!";
  $("msg").className="msg";
};
$("tabs").onclick=e=>{
  const b=e.target.closest("[data-t]");if(!b)return;
  tab=b.dataset.t;cat=SECT[tab][2][0][0];lvl=1;show();
};
$("pills").onclick=e=>{
  const b=e.target.closest("[data-c]");if(!b)return;
  cat=b.dataset.c;show();
};
$("lvs").onclick=e=>{
  const b=e.target.closest("[data-l]");if(!b)return;
  lvl=+b.dataset.l;renderNav();next();
};
$("reset").onclick=()=>{
  if(confirm("Точно скинути весь прогрес? Це не можна скасувати.")){st={xp:0,c:{},d:{}};save();show();}
};

show();
</script>
</body>
</html>
